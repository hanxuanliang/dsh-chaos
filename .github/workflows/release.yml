name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Resume publication for an existing release tag
        required: false
        type: boolean
        default: false
      release_tag:
        description: Existing vX.Y.Z tag to publish during a manual resume
        required: false
        type: string
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-native:
    name: Native ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            source: target/x86_64-unknown-linux-gnu/release/libdsh_chaos_core.so
            verify: true
          - id: win32-x64-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            source: target/x86_64-pc-windows-msvc/release/dsh_chaos_core.dll
            verify: true
          - id: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            source: target/x86_64-apple-darwin/release/libdsh_chaos_core.dylib
            verify: true
          - id: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            source: target/aarch64-apple-darwin/release/libdsh_chaos_core.dylib
            verify: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cargo build -p dsh-chaos-core --features napi --release --locked --target ${{ matrix.target }}
      - run: node scripts/stage-release-native.mjs npm/${{ matrix.id }} ${{ matrix.source }}
      - if: matrix.verify
        run: node scripts/verify-native-package.mjs npm/${{ matrix.id }}
      - run: npm pack --dry-run --ignore-scripts ./npm/${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.id }}
          path: npm/${{ matrix.id }}/dsh_chaos_core.node
          if-no-files-found: error

  publish:
    name: Publish npm packages
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.release_tag != '')
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm public:check
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64-gnu
          path: npm/linux-x64-gnu
      - uses: actions/download-artifact@v4
        with:
          name: native-win32-x64-msvc
          path: npm/win32-x64-msvc
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-x64
          path: npm/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-arm64
          path: npm/darwin-arm64
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: pnpm typecheck
      - run: pnpm build:package
      - run: pnpm smoke:native
      - run: pnpm smoke:service
      - run: pnpm smoke:runtime
      - run: pnpm smoke:remote
      - run: pnpm smoke:transport
      - run: pnpm smoke:client
      - name: Verify tag and package contents
        run: node scripts/check-release.mjs
      - name: Publish native packages first
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          publish_if_missing() {
            package_name="$1"
            package_path="$2"
            if npm view "${package_name}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "${package_name}@${VERSION} already exists; skipping"
            else
              npm publish "${package_path}" --access public --provenance --tag next
            fi
          }
          publish_if_missing @hanxuanliang/dsh-chaos-linux-x64-gnu ./npm/linux-x64-gnu
          publish_if_missing @hanxuanliang/dsh-chaos-win32-x64-msvc ./npm/win32-x64-msvc
          publish_if_missing @hanxuanliang/dsh-chaos-darwin-x64 ./npm/darwin-x64
          publish_if_missing @hanxuanliang/dsh-chaos-darwin-arm64 ./npm/darwin-arm64
      - name: Pack and publish root plugin
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          if npm view "@hanxuanliang/dsh-chaos@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@hanxuanliang/dsh-chaos@${VERSION} already exists; skipping"
          else
            npm publish ./release/hanxuanliang-dsh-chaos-*.tgz --access public --provenance --tag next
          fi
      - name: Verify published versions are visible
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          verify_published() {
            package_name="$1"
            for attempt in 1 2 3 4 5; do
              actual="$(npm view "${package_name}@${VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
              if [ "${actual}" = "${VERSION}" ]; then
                echo "${package_name}@${VERSION} is visible"
                return 0
              fi
              sleep 3
            done
            echo "${package_name}@${VERSION} is not visible in the npm registry" >&2
            return 1
          }
          verify_published @hanxuanliang/dsh-chaos-linux-x64-gnu
          verify_published @hanxuanliang/dsh-chaos-win32-x64-msvc
          verify_published @hanxuanliang/dsh-chaos-darwin-x64
          verify_published @hanxuanliang/dsh-chaos-darwin-arm64
          verify_published @hanxuanliang/dsh-chaos
      - name: Promote published packages to latest
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          npm dist-tag add @hanxuanliang/dsh-chaos-linux-x64-gnu@${VERSION} latest
          npm dist-tag add @hanxuanliang/dsh-chaos-win32-x64-msvc@${VERSION} latest
          npm dist-tag add @hanxuanliang/dsh-chaos-darwin-x64@${VERSION} latest
          npm dist-tag add @hanxuanliang/dsh-chaos-darwin-arm64@${VERSION} latest
          npm dist-tag add @hanxuanliang/dsh-chaos@${VERSION} latest
