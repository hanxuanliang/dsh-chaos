<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">dsh-chaos logo</title>
  <desc id="desc">A neobrutalist C-shaped chaos route around a channel hash, branching into two thread reply bubbles.</desc>

  <rect x="36" y="42" width="436" height="436" rx="54" fill="#111111"/>
  <rect x="24" y="24" width="436" height="436" rx="54" fill="#FFF6DF" stroke="#111111" stroke-width="12"/>

  <!-- C = Chaos: an open route that can accept another collaborator. -->
  <path d="M354 142C322 103 269 84 218 94C143 108 91 176 91 253C91 339 157 410 242 416C300 420 354 396 389 352"
        fill="none" stroke="#111111" stroke-width="58" stroke-linecap="round"/>
  <path d="M354 142C322 103 269 84 218 94C143 108 91 176 91 253C91 339 157 410 242 416C300 420 354 396 389 352"
        fill="none" stroke="#37DDF5" stroke-width="36" stroke-linecap="round"/>

  <!-- # = the shared Channel, drawn as geometry rather than font text. -->
  <g fill="none" stroke-linecap="square">
    <path d="M238 172L216 337M313 172L291 337M190 230H338M181 292H329" stroke="#111111" stroke-width="38"/>
    <path d="M238 172L216 337M313 172L291 337M190 230H338M181 292H329" stroke="#FFD60A" stroke-width="20"/>
  </g>

  <!-- One Channel message branches into two nested Thread replies. -->
  <path d="M329 261H365M365 261V207M365 261V316M365 207H386M365 316H386"
        fill="none" stroke="#111111" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>
  <g stroke="#111111" stroke-width="10" stroke-linejoin="round">
    <path d="M383 174H440V220H414L396 235V220H383Z" fill="#FF4F9A"/>
    <path d="M383 286H440V332H414L396 347V332H383Z" fill="#FFFDF4"/>
  </g>
  <circle cx="411" cy="198" r="7" fill="#111111"/>
  <path d="M400 310H422" stroke="#111111" stroke-width="8" stroke-linecap="square"/>

  <!-- A root Message enters the Channel from the left. -->
  <path d="M79 222H142V276H113L92 294V276H79Z" fill="#FF4F9A" stroke="#111111" stroke-width="10" stroke-linejoin="round"/>
  <path d="M105 249H124" stroke="#111111" stroke-width="8" stroke-linecap="square"/>
</svg>
