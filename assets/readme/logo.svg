<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">dsh-chaos logo</title>
  <desc id="desc">Three equal message nodes divide a C-shaped route into three arcs around an outward-shifted concentric collaboration target.</desc>

  <rect x="36" y="42" width="436" height="436" rx="54" fill="#111111"/>
  <rect x="24" y="24" width="436" height="436" rx="54" fill="#FFF6DF" stroke="#111111" stroke-width="12"/>

  <!-- A mathematically even C: three 90-degree arcs, open on the right. -->
  <g fill="none" stroke-linecap="round">
    <path d="M367 133A165 165 0 0 0 133 133" stroke="#111111" stroke-width="58"/>
    <path d="M133 133A165 165 0 0 0 133 367" stroke="#111111" stroke-width="58"/>
    <path d="M133 367A165 165 0 0 0 367 367" stroke="#111111" stroke-width="58"/>
    <path d="M367 133A165 165 0 0 0 133 133" stroke="#37DDF5" stroke-width="36"/>
    <path d="M133 133A165 165 0 0 0 133 367" stroke="#37DDF5" stroke-width="36"/>
    <path d="M133 367A165 165 0 0 0 367 367" stroke="#37DDF5" stroke-width="36"/>
  </g>

  <!-- Each equal arc is owned by one equal Message node. -->
  <g fill="none" stroke="#111111" stroke-width="11" stroke-linecap="round">
    <path d="M250 118L276 169"/>
    <path d="M118 250H206"/>
    <path d="M250 382L276 331"/>
  </g>
  <g stroke="#111111" stroke-width="10" stroke-linejoin="round">
    <path d="M210 60H290V120H254L230 140V120H210Z" fill="#FF4F9A"/>
    <path d="M50 220H130V280H94L70 300V280H50Z" fill="#FFD60A"/>
    <path d="M210 380H290V440H254L230 460V440H210Z" fill="#FF4F9A"/>
  </g>
  <g fill="#111111">
    <circle cx="232" cy="90" r="7"/>
    <circle cx="268" cy="90" r="7"/>
    <circle cx="72" cy="250" r="7"/>
    <circle cx="108" cy="250" r="7"/>
    <circle cx="232" cy="410" r="7"/>
    <circle cx="268" cy="410" r="7"/>
  </g>

  <!-- The shared target sits toward the open edge: collaboration creates outward motion. -->
  <circle cx="290" cy="250" r="84" fill="#FF4F9A" stroke="#111111" stroke-width="13"/>
  <circle cx="290" cy="250" r="55" fill="#FFD60A" stroke="#111111" stroke-width="11"/>
  <circle cx="290" cy="250" r="27" fill="#37DDF5" stroke="#111111" stroke-width="9"/>
</svg>
