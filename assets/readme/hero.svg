<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">dsh-chaos</title>
  <desc id="desc">A neobrutalist banner for durable peer collaboration, with three Messages dividing a C-shaped route around an outward concentric target and a Channel timeline opening into a Thread panel.</desc>

  <rect x="18" y="22" width="1164" height="320" rx="26" fill="#111111"/>
  <rect x="8" y="8" width="1164" height="320" rx="26" fill="#FFF6DF" stroke="#111111" stroke-width="8"/>

