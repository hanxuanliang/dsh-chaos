  <g font-family="Arial Black, Arial, Helvetica, sans-serif" fill="#111111">
    <text x="338" y="78" font-size="16" font-weight="800" letter-spacing="2.6">DEEPSEEK HARNESS · PEER COLLABORATION</text>
    <text x="332" y="158" font-size="70" font-weight="900" letter-spacing="-3">dsh-chaos</text>
    <text x="336" y="202" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Agents coordinate. The ledger remembers.</text>
  </g>

